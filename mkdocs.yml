site_name: CH Microsystems Documentation
site_author: Julio Avelar
site_description: Documentation for CH Microsystems devices and software.
site_url: https://docs.chmicrosystems.com
repo_name: docs
repo_url: https://github.com/CHMicrosystems/docs
copyright: CC BY-SA 4.0
theme: readthedocs

plugins:
  - search:
      lang:
        - en
        - pt
  - i18n:
      languages:
        - locale: en
          name: English
        - locale: pt
          default: true
          name: Português


nav:
  - Home: index.md
  - About: about.md

